<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>numberJuan.io — Pre-Fab UI Library (650+ Modules)</title>
<meta name="description" content="Browse 650+ live animation and UI modules, copy the prompt or the code, and use them to rebuild any design with Automato AI.">
<meta name="theme-color" content="#0b0706">
<link rel="icon" type="image/svg+xml" href="assets/mascot.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400..800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>try{var t=localStorage.getItem('numberjuan-theme')||localStorage.getItem('automato-theme');if(t)document.documentElement.dataset.theme=t;else document.documentElement.dataset.theme='light'}catch(e){}</script>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Sections">
    <a class="brand" href="index.html" aria-label="numberJuan.io home">
      <img src="assets/mascot.svg" alt="Juan" width="34" height="34" style="border-radius:50%;border:1.5px solid #18120C;flex-shrink:0" />
      <span class="brand-text" style="font-family:'Righteous',cursive;font-size:1.28rem">number<span style="color:#1D4ED8">Juan</span><span class="brand-badge" style="background:#F59E0B;color:#18120C;font-family:monospace;padding:1px 5px;border-radius:4px;font-size:0.65rem;border:1px solid #18120C;margin-left:4px">.io</span><small style="display:block;font-size:0.75rem;font-family:var(--font);font-weight:600;color:var(--muted)">Pre-Fab UI Library</small></span>
    </a>
    <div class="site-switch">
      <a href="index.html" class="site-pill" title="Return to numberJuan.io home">
        <span>← numberJuan.io</span>
      </a>
    </div>
    <nav class="tabs" aria-label="App">
      <a href="library.html" aria-current="page" id="tab-library">✦ Pre-Fab Library</a>
      <a href="builder.html" id="tab-builder">✦ Blueprint Studio</a>
      <a href="creator.html" id="tab-creator">The Creator</a>
    </nav>
    <label class="search">
      <span id="search-ico"></span>
      <input id="search" type="search" placeholder="Search all modules" autocomplete="off" aria-label="Search modules">
    </label>
    <nav class="nav" id="nav" aria-label="Categories"></nav>
    <div class="side-foot">
      <span><b id="total">0</b> modules</span>
      <button class="icon-btn" id="theme" type="button"></button>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="head">
      <div>
        <h1><span id="title">Loading</span><em id="count"></em></h1>
        <p id="blurb"></p>
      </div>
      <button class="btn" id="pause" type="button" aria-pressed="false">Pause motion</button>
    </header>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>No modules match that search.</div>
  </main>
</div>

<dialog id="viewer" aria-labelledby="v-title">
  <div class="viewer">
    <div class="v-stage"><div class="v-frame" id="v-frame"></div></div>
    <aside class="v-info">
      <div class="row between"><span class="badge" id="v-cat"></span><button class="icon-btn" id="v-close" type="button" aria-label="Close preview"></button></div>
      <h2 id="v-title"></h2>
      <p style="margin:0;color:var(--muted)" id="v-sub"></p>
      <div class="badges" id="v-badges"></div>
      <div class="row">
        <button class="btn" data-copy="prompt" type="button"></button>
        <button class="btn primary" data-copy="code" type="button"></button>
      </div>
      <div><p class="v-label">Prompt</p><div class="v-prompt" id="v-prompt"></div></div>
      <div class="row between" style="margin-top:auto">
        <button class="btn sm" id="v-prev" type="button">Previous</button>
        <span id="v-pos" style="color:var(--muted);font:600 12px var(--mono)"></span>
        <button class="btn sm" id="v-next" type="button">Next</button>
      </div>
    </aside>
  </div>
</dialog>

<script type="module" src="js/library.js"></script>
</body>
</html>
