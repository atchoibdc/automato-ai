<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automato AI: Wireframe Builder</title>
<meta name="description" content="Upload a design image and let Automato AI rebuild it from library modules. Swap, reorder and export the result as one HTML file.">
<meta name="theme-color" content="#0b0706">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='22' fill='%23ff4433'/%3E%3Cpath d='M32 16l-8-8 10 4 6-6-2 9 10 0-10 5z' fill='%2378e05a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400..800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>try{var t=localStorage.getItem('automato-theme')||localStorage.getItem('atelier-theme');if(t)document.documentElement.dataset.theme=t;else document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body>
<div class="b-shell">
  <aside class="b-side" aria-label="Controls">
    <div class="row between">
      <a class="brand" href="index.html" aria-label="Automato AI home">
        <span class="brand-mark" id="logo"></span>
        <span class="brand-text"><b>AUTO<span class="brand-tomato">MATO</span> <span class="brand-badge">AI</span></b><small>Wireframe builder</small></span>
      </a>
      <button class="icon-btn" id="theme" type="button"></button>
    </div>
    <div class="site-switch">
      <a href="index.html" class="site-pill" title="Return to Automato AI home">
        <span>← automato.ai</span>
      </a>
    </div>
    <nav class="tabs" aria-label="App">
      <a href="library.html" id="tab-library">Library</a>
      <a href="builder.html" aria-current="page" id="tab-builder">Builder</a>
      <a href="creator.html" id="tab-creator">Creator</a>
    </nav>

    <section class="panel" aria-labelledby="h-up">
      <h3 id="h-up">1. Upload a design</h3>
      <label class="drop" id="drop">
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp">
        <b>Drop a screenshot or click to browse</b>
        <small>PNG, JPEG or WebP, up to 12 MB. You can also paste from the clipboard.</small>
      </label>
      <div class="ref" id="ref" hidden><img id="ref-img" alt="Uploaded design"></div>
    </section>

    <section class="panel" aria-labelledby="h-go">
      <h3 id="h-go">2. Build</h3>
      <div class="row" style="flex-direction:column;align-items:stretch;gap:10px">
        <textarea class="notes" id="notes" placeholder="Optional notes, e.g. SaaS landing page, dark theme, keep it minimal" aria-label="Notes for the agent"></textarea>
        <label class="row" style="gap:8px;font-size:13px;color:var(--ink-2)"><input type="checkbox" id="retext" checked> Use the text from the design</label>
        <button class="btn primary" id="go" type="button" disabled>Analyze and build</button>
        <div class="status" id="status" role="status" aria-live="polite" hidden></div>
        <ul class="steps" id="steps" hidden>
          <li data-s="read">Reading the design</li>
          <li data-s="match">Matching modules</li>
          <li data-s="copy">Writing the copy</li>
          <li data-s="draw">Assembling the page</li>
        </ul>
      </div>
    </section>

    <section class="panel" aria-labelledby="h-th">
      <h3 id="h-th">3. Style</h3>
      <div class="row" style="flex-direction:column;align-items:stretch;gap:10px">
        <div class="seg" role="group" aria-label="Page mode">
          <button type="button" data-mode="light" aria-pressed="true">Light</button>
          <button type="button" data-mode="dark" aria-pressed="false">Dark</button>
        </div>
        <div class="field"><label for="accent">Accent color</label><input id="accent" type="color" value="#ff4433"></div>
      </div>
    </section>

    <section class="panel" aria-labelledby="h-ex">
      <h3 id="h-ex">4. Export</h3>
      <div class="row">
        <button class="btn primary" id="dl" type="button">Download HTML</button>
        <button class="btn" id="preview" type="button">Open preview</button>
        <button class="btn" id="copyhtml" type="button">Copy HTML</button>
        <button class="btn" id="recipe" type="button">Save recipe</button>
        <label class="btn" for="recipe-in">Load recipe</label>
        <input id="recipe-in" type="file" accept="application/json" hidden>
      </div>
    </section>
  </aside>

  <main class="b-main">
    <div class="b-top">
      <div><h1>Your page</h1><p id="summary">No sections yet. Upload a design or add a section by hand.</p></div>
      <div class="row">
        <button class="btn" id="pause" type="button" aria-pressed="false">Pause motion</button>
        <button class="btn" id="clear" type="button">Clear</button>
      </div>
    </div>
    <div class="page" id="page"></div>
  </main>
</div>

<dialog id="picker" aria-labelledby="pk-title">
  <div class="swap">
    <header>
      <h2 id="pk-title">Choose a module</h2>
      <div class="row">
        <select id="pk-role" aria-label="Section type" class="btn"></select>
        <input id="pk-q" type="search" placeholder="Filter" aria-label="Filter modules" style="padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)">
        <button class="icon-btn" id="pk-close" type="button" aria-label="Close"></button>
      </div>
    </header>
    <div class="body"><div class="grid" id="pk-grid"></div></div>
  </div>
</dialog>

<script type="module" src="js/builder.js"></script>
</body>
</html>
