  <circle cx="50" cy="50" r="39" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3,3"/>
  
  <!-- Cartoon Hair (retro pompadour / swoop) -->
  <path d="M26 44 C26 24 38 18 52 18 C66 18 76 26 74 40 C73 34 68 28 58 28 C46 28 36 34 32 44 Z" fill="#18120C"/>
  <path d="M36 26 C45 16 65 18 72 28 C68 22 55 20 44 24 Z" fill="#3B82F6" opacity="0.3"/>

