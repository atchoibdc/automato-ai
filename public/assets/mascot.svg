  </defs>
  <!-- Atomic Starburst Glow -->
  <path d="M50 2 L56 36 L90 20 L64 46 L98 50 L64 54 L90 80 L56 64 L50 98 L44 64 L10 80 L36 54 L2 50 L36 46 L10 20 L44 36 Z" fill="url(#goldGrad)" opacity="0.22"/>
