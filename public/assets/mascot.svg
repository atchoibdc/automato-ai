  <!-- Rosy Cartoon Cheeks -->
  <circle cx="35" cy="49" r="4" fill="#F87171" opacity="0.6"/>
  <circle cx="65" cy="49" r="4" fill="#F87171" opacity="0.6"/>

  <!-- Nose -->
  <path d="M50 43 Q53 47 49 48" fill="none" stroke="#18120C" stroke-width="2.5" stroke-linecap="round"/>

