  <path d="M30 42 C30 62 40 72 50 72 C60 72 70 62 70 42 C70 32 60 26 50 26 C40 26 30 32 30 42 Z" fill="#FED7AA" stroke="#18120C" stroke-width="3.5"/>
  
  <!-- Ears -->
  <circle cx="28" cy="46" r="6" fill="#FDBA74" stroke="#18120C" stroke-width="2.5"/>
  <circle cx="72" cy="46" r="6" fill="#FDBA74" stroke="#18120C" stroke-width="2.5"/>

